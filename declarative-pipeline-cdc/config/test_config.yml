# Databricks Notebook Test Framework Configuration

workspace:
  # Authentication via DATABRICKS_CONFIG_PROFILE env var or --profile flag

cluster:
  libraries:
    - pypi:
        package: "dbx_test"

execution:
  timeout: 600
  parallel: false

reporting:
  output_dir: ".dbx-test-results"
  formats:
    - "console"
    - "junit"
    - "json"
  verbose: true
